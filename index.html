<style>
body, html {margin:0;padding:0;font-family:Arial,sans-serif;height:100%;width:100%;display:flex;flex-direction:column;background:#F3F4F6;}
.app {flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:1.5cm 1.5rem 1.5rem 1.5rem;width:100%;box-sizing:border-box;}
.header {background-color:#5B5B5B;color:#fff;padding:1rem;width:100%;text-align:center;box-sizing:border-box;margin-bottom:0.5rem;min-height:3.5rem;display:flex;align-items:center;justify-content:center;cursor:default; /* 改成 default 因為已經沒有連結了 */}
.header h2 {color:white;margin:0;font-size:1.2rem;text-shadow:2px 2px 4px rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;flex-wrap:wrap;line-height: 1.4;}

.content {width:100%;max-width:28rem;margin-top:0rem;}
.welcome-text {font-size:2.2rem;font-weight:800;text-align:center;margin-bottom:4rem;color:#1F2937;animation:fadeInDown 1s ease forwards;}
@keyframes fadeInDown {from{opacity:0;transform:translateY(-50px);} to{opacity:1;transform:translateY(0);}}
.welcome-text.show{opacity:1;transform:translateY(0);}

.button-wrapper{position:relative;margin-bottom:1.5rem;transition:transform 0.3s ease;}
.button-wrapper:hover{transform:translateY(-5px);}
.button-wrapper::before{content:'';position:absolute;inset:0;border-radius:1rem;opacity:0.75;filter:blur(1rem);transition:opacity 1s;}
.button-wrapper:hover::before{opacity:1;}
.gradient-blue::before{background:linear-gradient(to right,#9CA3AF,#4B5563);}
.gradient-purple::before{background:linear-gradient(to right,#D1D5DB,#6B7280);}
.gradient-green::before{background:linear-gradient(to right,#E5E7EB,#9CA3AF);}
.button{position:relative;width:100%;padding:1.5rem 2rem;background-color:#4B5563;color:#fff;border-radius:1rem;border:none;font-size:1.5rem;font-weight:700;display:flex;align-items:center;justify-content:space-between;overflow:hidden;cursor:pointer;transition:all 0.3s ease-in-out;}
.button:hover{background:#374151;}
.button-text{display:flex;align-items:center;}
.button-icon{width:1.5rem;height:1.5rem;margin-right:0.75rem;transition:transform 0.3s ease;}
.button:hover .button-icon{transform:rotate(15deg);}
.chevron{width:1.75rem;height:1.75rem;transition:transform 0.3s ease;}
.button:hover .chevron{transform:translateX(5px);}
.button::after{content:'';position:absolute;inset:0;opacity:0;transition:opacity 0.3s;top:-3px;left:-3px;right:-3px;bottom:-3px;background:linear-gradient(135deg,#9CA3AF,#374151);border-radius:inherit;z-index:-1;filter:blur(8px);opacity:0.8;}
.button:hover::after{opacity:0.2;}

.logo-link{display:block;text-align:center;}
.welcome-image{display:block;margin:0.5rem auto 2rem auto;max-width:200px;height:auto;}
.footer{text-align:center;padding:13px 0;font-size:14px;color:#6b7280;background-color:#f9fafb;line-height:1.6;}
</style>

<script>
    // 倒數計時器邏輯
    function updateCountdown() {
        // 目標日期與時間
        const targetDate = new Date('2026-06-10T00:00:00').getTime();
        const now = new Date().getTime();
        const distance = targetDate - now;

        const displayElement = document.getElementById('countdownDisplay');

        // 如果時間已到或超過
        if (distance <= 0) {
            displayElement.innerText = '投稿系統目前暫停服務';
            return; // 停止執行後續計算
        }

        // 計算剩餘的天、小時、分、秒
        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((distance % (1000 * 60)) / 1000);

        // 依照要求自動切換單位
        if (days > 0) {
            displayElement.innerText = `畢業倒數： ${days} 天`;
        } else if (hours > 0) {
            displayElement.innerText = `畢業倒數： ${hours} 小時`;
        } else if (minutes > 0) {
            displayElement.innerText = `畢業倒數： ${minutes} 分`;
        } else {
            displayElement.innerText = `畢業倒數： ${seconds} 秒`;
        }
    }

    // 網頁載入時先執行一次，避免出現預設文字太久
    updateCountdown();
    // 設定每秒 (1000毫秒) 更新一次
    setInterval(updateCountdown, 1000);
</script>
